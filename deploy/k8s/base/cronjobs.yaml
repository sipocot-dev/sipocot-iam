apiVersion: batch/v1
kind: CronJob
metadata:
  name: sipocot-iam-backup
spec:
  schedule: '0 18 * * *' # 02:00 Asia/Manila
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: sipocot-iam, app.kubernetes.io/component: backup }
        spec:
          restartPolicy: Never
          serviceAccountName: sipocot-iam
          securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: backup
              image: sipocot-iam-backup
              env:
                - { name: HOME, value: /tmp }
                - { name: BACKUP_SSE, value: aws:kms }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: sipocot-iam-secrets, key: BACKUP_DATABASE_URL } }
                - name: BACKUP_S3_URI
                  valueFrom: { secretKeyRef: { name: sipocot-iam-secrets, key: BACKUP_S3_URI } }
                - name: BACKUP_ENCRYPTION_PASSPHRASE
                  valueFrom: { secretKeyRef: { name: sipocot-iam-secrets, key: BACKUP_ENCRYPTION_PASSPHRASE } }
              resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
              securityContext:
                { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: { sizeLimit: 10Gi } }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sipocot-iam-purge-sessions
spec:
  schedule: '17 3 * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app.kubernetes.io/name: sipocot-iam, app.kubernetes.io/component: cron }
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: purge
              image: curlimages/curl:8.17.0
              env:
                - name: CRON_SECRET
                  valueFrom: { secretKeyRef: { name: sipocot-iam-secrets, key: CRON_SECRET } }
              args:
                [
                  '-fsS',
                  '-H',
                  'Authorization: Bearer $(CRON_SECRET)',
                  'http://sipocot-iam/api/internal/cron/purge-sessions',
                ]
              resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
              securityContext:
                { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
