apiVersion: apps/v1
kind: Deployment
metadata:
  name: sipocot-iam
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: sipocot-iam, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sipocot-iam, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: sipocot-iam
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: sipocot-iam, app.kubernetes.io/component: api }
      containers:
        - name: api
          image: sipocot-iam
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: sipocot-iam-config }
            # Provisioned by External Secrets / Sealed Secrets — see secret.example.yaml.
            - secretRef: { name: sipocot-iam-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Let endpoints / ingress stop routing before SIGTERM.
            preStop: { sleep: { seconds: 5 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
