# Run before rolling out a new version (CI applies it and waits for completion).
apiVersion: batch/v1
kind: Job
metadata:
  name: sipocot-iam-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: sipocot-iam, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: sipocot-iam-migrator
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom: { secretKeyRef: { name: sipocot-iam-secrets, key: MIGRATION_DATABASE_URL } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          securityContext:
            { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
