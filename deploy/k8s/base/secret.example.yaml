# NOT applied by kustomize. Provision real values via External Secrets Operator,
# Sealed Secrets or your cloud secret manager — never commit them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sipocot-iam-secrets
  namespace: sipocot-iam
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: sipocot-iam-secrets }
  dataFrom:
    - extract: { key: sipocot-iam/production }
  # Expected keys:
  #   APP_URL DATABASE_URL MIGRATION_DATABASE_URL BACKUP_DATABASE_URL REDIS_URL
  #   ENCRYPTION_KEYS ENCRYPTION_ACTIVE_KEY_ID PASSWORD_PEPPER
  #   S3_BUCKET S3_KMS_KEY_ID METRICS_TOKEN CRON_SECRET
  #   BACKUP_S3_URI BACKUP_ENCRYPTION_PASSPHRASE
