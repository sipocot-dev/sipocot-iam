apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sipocot-iam
spec:
  selector: { matchLabels: { app.kubernetes.io/component: api } }
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      authorization:
        type: Bearer
        credentials: { name: sipocot-iam-secrets, key: METRICS_TOKEN }
