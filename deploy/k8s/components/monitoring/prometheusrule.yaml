apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sipocot-iam
spec:
  groups:
    - name: sipocot-iam.rules
      rules:
        - alert: SipocotIamHighErrorRate
          expr: |
            sum(rate(http_requests_total{service="sipocot-iam",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{service="sipocot-iam"}[5m])), 1) > 0.02
          for: 10m
          labels: { severity: page }
          annotations: { summary: 'More than 2% of requests are failing with 5xx' }
        - alert: SipocotIamHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="sipocot-iam"}[5m]))) > 1
          for: 10m
          labels: { severity: warn }
          annotations: { summary: 'p95 latency above 1s' }
        - alert: SipocotIamLoginFailureSpike
          expr: sum(rate(auth_events_total{event="login",outcome="failure"}[5m])) > 5
          for: 5m
          labels: { severity: warn }
          annotations: { summary: 'Possible credential stuffing: sustained login failures' }
        - alert: SipocotIamRateLimiting
          expr: sum by (policy) (rate(rate_limited_total[5m])) > 1
          for: 10m
          labels: { severity: info }
          annotations: { summary: 'Rate limiting active for {{ $labels.policy }}' }
        - alert: SipocotIamBackupFailed
          expr: kube_job_status_failed{namespace="sipocot-iam",job_name=~"sipocot-iam-backup.*"} > 0
          labels: { severity: page }
          annotations: { summary: 'Database backup job failed' }
