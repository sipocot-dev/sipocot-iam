apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sipocot-iam
resources: [namespace.yaml, ../../base]
components: [../../components/monitoring]
patches:
  - target: { kind: Deployment, name: sipocot-iam }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: HorizontalPodAutoscaler, name: sipocot-iam }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: { kind: ServiceAccount, name: sipocot-iam }
    patch: |
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::ACCOUNT_ID:role/sipocot-iam
