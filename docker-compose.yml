# Local development stack: Postgres, Redis, SeaweedFS (S3-compatible).
#   docker compose up -d            → dependencies only (run `pnpm dev` on the host)
#   docker compose --profile app up → also builds and runs the production image
name: sipocot-iam

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sipocot
      POSTGRES_PASSWORD: sipocot
      POSTGRES_DB: sipocot_iam
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sipocot -d sipocot_iam']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', 'sipocot', '--appendonly', 'no', '--maxmemory-policy', 'volatile-lru']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'sipocot', 'ping']
      interval: 5s
      retries: 10

  # S3-compatible object store (supports presigned POST policies).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports: ['8333:8333']
    volumes:
      - s3data:/data
      - ./deploy/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli:2.38.5
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: sipocot
      AWS_SECRET_ACCESS_KEY: sipocot-secret
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_ENDPOINT_URL: http://s3:8333
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for i in $$(seq 1 30); do aws s3 ls >/dev/null 2>&1 && break; sleep 1; done
        aws s3 mb s3://sipocot-iam-files 2>/dev/null || true
        aws s3 mb s3://sipocot-iam-backups 2>/dev/null || true
        aws s3api put-bucket-cors --bucket sipocot-iam-files --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["POST","GET"],"AllowedHeaders":["*"],"MaxAgeSeconds":600}]}' || true
        echo buckets ready

  migrate:
    profiles: [app]
    build: { context: ., target: migrator }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sipocot:sipocot@postgres:5432/sipocot_iam
    depends_on: { postgres: { condition: service_healthy } }

  app:
    profiles: [app]
    build: { context: ., target: runner }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sipocot:sipocot@postgres:5432/sipocot_iam
      REDIS_URL: redis://:sipocot@redis:6379/0
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
    ports: ['3000:3000']
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
