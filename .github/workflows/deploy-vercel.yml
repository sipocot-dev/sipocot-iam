# Migrate first, then deploy. Connect the Vercel Git integration for previews, but
# disable auto production deploys so migrations always run before new code ships.
name: Deploy (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Deploy to Vercel
        run: |
          pnpm dlx vercel@65.8.0 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          pnpm dlx vercel@65.8.0 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          pnpm dlx vercel@65.8.0 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test
        run: curl -fsS "${{ vars.PRODUCTION_URL }}/api/health/ready"
