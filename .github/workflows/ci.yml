name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 7 }

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: sipocot, POSTGRES_PASSWORD: sipocot, POSTGRES_DB: sipocot_iam_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sipocot" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sipocot:sipocot@localhost:5432/sipocot_iam_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  container:
    name: Container image · scan
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (Grype)
        id: scan
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.scan.outputs.sarif != ''
        with: { sarif_file: '${{ steps.scan.outputs.sarif }}', category: container }
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with: { image: '${{ env.IMAGE }}:${{ github.sha }}', format: spdx-json, output-file: sbom.spdx.json }
      - name: Push images (main only)
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          for target in migrator backup; do
            docker buildx build --target "$target" --build-arg APP_VERSION=${{ github.sha }} \
              --cache-from type=gha -t "$IMAGE-$target:${{ github.sha }}" --push .
          done
